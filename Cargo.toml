[package]
name = "baidupcsr-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://example.invalid/baidupcsr"
rust-version = "1.88"

[lib]
name = "baidupcsr"
path = "src/lib.rs"

[[bin]]
name = "baidupcsr-cli"
path = "src/main.rs"

[dependencies]
bytesize = "1.3"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
md-5 = "0.10"
ratatui = "0.30.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "webpki-roots", "stream"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
thiserror = "1.0"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "process", "signal", "io-util"] }
tokio-util = "0.7"
unicode-width = "0.2"
url = "2.5"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
lto = true
codegen-units = 1
strip = true
panic = "abort"
