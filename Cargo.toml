[package]
name = "baidupcsr-cli"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[lib]
name = "baidupcsr"
path = "src/lib.rs"

[[bin]]
name = "baidupcsr-cli"
path = "src/main.rs"

[dependencies]
atomic-write-file = "0.3"
bytes = "1.12"
clap = { version = "4.6", features = ["derive"] }
clap_complete = "4.6"
cookie = "0.18"
crossterm = { version = "0.29", features = ["event-stream"] }
dirs = "7"
futures-util = "0.3"
headers = "0.4"
hex = "0.4"
imagesize = "0.15"
lru = "0.18"
md-5 = "0.11"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.11"
shell-words = "1.1"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting", "local-offset", "macros"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "process", "io-util"] }
tokio-util = "0.7"
toml = "1.1"
unicode-width = "0.2"
url = "2.5"

[dev-dependencies]
insta = "1"
tempfile = "3"
tokio = { version = "1.53", features = ["test-util"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.dev.package."*"]
opt-level = 2
